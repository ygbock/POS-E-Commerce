name: Repair Header Compile Error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Repair Header and Login import
        shell: python
        run: |
          from pathlib import Path
          header = Path('src/components/layout/Header.tsx')
          text = header.read_text(encoding='utf-8')
          text = text.replace("        {import.meta.env.DEV && (\n                  {/* Role Persona Switcher */}\n                  <div className=\"relative\">", "        {import.meta.env.DEV && (\n          <div className=\"relative\">", 1)
          text = text.replace("                  </div>\n          \n          \n        )}", "          </div>\n        )}", 1)
          header.write_text(text, encoding='utf-8')
          login = Path('src/components/auth/LoginPage.tsx')
          text = login.read_text(encoding='utf-8')
          text = text.replace("from '../services/authClient'", "from '../../services/authClient'", 1)
          login.write_text(text, encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          npm ci
          npm run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/Header.tsx src/components/auth/LoginPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(build): repair Header JSX and Login auth import"
          git push origin main
