name: Repair Header and Discovery CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Repair malformed development role switcher and register Discovery tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/layout/Header.tsx')
          text = p.read_text(encoding='utf-8')
          bad = """        {import.meta.env.DEV && (\n                  {/* Role Persona Switcher */}\n                  <div className=\"relative\">"""
          good = """        {import.meta.env.DEV && (\n          <div className=\"relative\">"""
          if bad in text:
              text = text.replace(bad, good, 1)
          else:
              raise SystemExit('Expected malformed Header role-switcher anchor not found')
          bad_end = """                  </div>\n          \n          \n        )}"""
          good_end = """          </div>\n        )}"""
          if bad_end in text:
              text = text.replace(bad_end, good_end, 1)
          else:
              raise SystemExit('Expected malformed Header role-switcher closing anchor not found')
          p.write_text(text, encoding='utf-8')

          pkg = Path('package.json')
          import json
          data = json.loads(pkg.read_text(encoding='utf-8'))
          scripts = data.setdefault('scripts', {})
          scripts['test:discovery'] = 'tsx tests/discovery.test.ts'
          pkg.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text(encoding='utf-8')
          marker = "      - name: 23. Tenant Business Plane (test:tenant-business-plane)\n        run: npm run test:tenant-business-plane\n"
          insertion = marker + "\n      - name: 24. Discovery Marketplace (test:discovery)\n        run: npm run test:discovery\n"
          if 'npm run test:discovery' not in ci_text:
              if marker not in ci_text:
                  raise SystemExit('CI tenant business plane anchor not found')
              ci_text = ci_text.replace(marker, insertion, 1)
              ci_text = ci_text.replace('      - name: 24. Full Regression Suite (npm test)', '      - name: 25. Full Regression Suite (npm test)', 1)
          ci.write_text(ci_text, encoding='utf-8')

      - name: Validate TypeScript
        run: |
          npm ci
          npm run lint

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/Header.tsx package.json .github/workflows/ci.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): repair header JSX and register discovery regression test"
          git push origin main
