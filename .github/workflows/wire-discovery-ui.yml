name: Wire Discovery UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Wire Discovery into navigation and app
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')
          if "DiscoveryMarketplace" not in text:
              anchor = "import { LoginPage } from './components/auth/LoginPage';"
              text = text.replace(anchor, "import { DiscoveryMarketplace } from './components/discovery/DiscoveryMarketplace';\n" + anchor, 1)
          if "activeTab === 'discovery'" not in text:
              anchor = "            {activeTab === 'dashboard' && <ExecutiveDashboard setActiveTab={setActiveTab} />}"
              text = text.replace(anchor, anchor + "\n            {activeTab === 'discovery' && <DiscoveryMarketplace />}" , 1)
          app.write_text(text, encoding='utf-8')

          sidebar = Path('src/components/layout/Sidebar.tsx')
          text = sidebar.read_text(encoding='utf-8')
          if "id: 'discovery'" not in text:
              anchor = "          {\n            id: 'storefront',\n            label: 'Storefront Portal',"
              insertion = "          { id: 'discovery', label: 'Discover Local', icon: Sparkles, badge: 'New', badgeColor: 'bg-indigo-600 text-white' },\n"
              if anchor not in text:
                  raise SystemExit('Storefront navigation anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)
          sidebar.write_text(text, encoding='utf-8')
      - name: Commit UI integration
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/components/layout/Sidebar.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/layout/Sidebar.tsx
          git commit -m "feat(discovery): integrate discovery marketplace UI"
          git push origin main
