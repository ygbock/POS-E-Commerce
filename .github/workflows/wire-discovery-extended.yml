name: Wire Extended Discovery Routes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add extended Discovery router
        shell: python
        run: |
          from pathlib import Path
          path = Path('server.ts')
          text = path.read_text(encoding='utf-8')
          import_line = "import { createDiscoveryRouter } from './server/routes/discoveryRoutes.ts';"
          if import_line not in text:
              anchor = "import { createDiscoveryBusinessRouter } from './server/routes/discoveryBusinessRoutes.ts';"
              if anchor not in text:
                  raise SystemExit('Discovery business import anchor not found')
              text = text.replace(anchor, anchor + "\n" + import_line, 1)
          mount_line = "  app.use('/api/discovery', createDiscoveryRouter(db));"
          if mount_line not in text:
              anchor = "  app.use('/api/discovery', createDiscoveryBusinessRouter(db));"
              if anchor not in text:
                  raise SystemExit('Discovery business mount anchor not found')
              text = text.replace(anchor, anchor + "\n\n  // Discovery search, product/service discovery, marketplace, reviews and analytics.\n" + mount_line, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- server.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(discovery): mount extended discovery router"
          git push origin main
