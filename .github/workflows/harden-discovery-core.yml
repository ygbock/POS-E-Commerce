name: Harden Discovery Core

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Harden discovery service and repository
        shell: python
        run: |
          from pathlib import Path

          service = Path('server/services/discoveryBusinessService.ts')
          text = service.read_text(encoding='utf-8')
          needle = "  async suspend(id: string, actor: { userId: string; role: string; organizationId?: string }, reason?: string, client?: DatabaseClient): Promise<DiscoveryBusinessRecord> {\n    this.assertModerator(actor);\n    return this.transition(id, 'SUSPENDED', actor, reason || 'Listing suspended.', client, true);\n  }\n\n"
          replacement = needle + "  async archive(id: string, actor: { userId: string; role: string; organizationId?: string }, reason?: string, client?: DatabaseClient): Promise<DiscoveryBusinessRecord> {\n    return this.transition(id, 'ARCHIVED', actor, reason || 'Listing archived.', client);\n  }\n\n"
          if 'async archive(id:' not in text:
              if needle not in text:
                  raise SystemExit('archive insertion point not found')
              text = text.replace(needle, replacement, 1)
          text = text.replace("data: await (service as any).transition(req.params.id,'ARCHIVED',actor(req),req.body?.reason||'Listing archived.')", "data: await service.archive(req.params.id,actor(req),req.body?.reason)", 1)
          service.write_text(text, encoding='utf-8')

          route = Path('server/routes/discoveryBusinessRoutes.ts')
          route_text = route.read_text(encoding='utf-8')
          old = "data:await (service as any).transition(req.params.id,'ARCHIVED',actor(req),req.body?.reason||'Listing archived.')"
          new = "data:await service.archive(req.params.id,actor(req),req.body?.reason)"
          if old in route_text:
              route_text = route_text.replace(old, new, 1)
          route.write_text(route_text, encoding='utf-8')

          repo = Path('server/repositories/discoveryBusinessRepository.ts')
          repo_text = repo.read_text(encoding='utf-8')
          old_locations = "`SELECT * FROM discovery_business_locations WHERE business_id = $1 ${options?.activeOnly === false ? '' : 'AND is_active = TRUE'} ORDER BY is_primary DESC, name ASC`, [businessId]);"
          new_locations = "`SELECT id, business_id, name, location_type, address_line_1, address_line_2, city, district, region, country, postal_code, latitude, longitude, service_radius_km, phone, is_primary, is_active, created_at, updated_at FROM discovery_business_locations WHERE business_id = $1 ${options?.activeOnly === false ? '' : 'AND is_active = TRUE'} ORDER BY is_primary DESC, name ASC`, [businessId]);"
          if old_locations not in repo_text:
              raise SystemExit('location query insertion point not found')
          repo_text = repo_text.replace(old_locations, new_locations, 1)
          repo.write_text(repo_text, encoding='utf-8')
      - name: Validate
        run: |
          npm ci
          npm run lint
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/discoveryBusinessService.ts server/routes/discoveryBusinessRoutes.ts server/repositories/discoveryBusinessRepository.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(discovery): harden archive API and public location projection"
          git push origin main
