name: Production Promotion & Approval Gate

on:
  workflow_dispatch:
    inputs:
      approved_commit_sha:
        description: "Approved Commit SHA (Must match verified staging release tuple)"
        required: true
        type: string
      approved_artifact_digest:
        description: "Approved Artifact Digest SHA-256 (Must match verified staging build)"
        required: true
        type: string

jobs:
  production-deployment-gate:
    name: Production Manual Approval Gate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://abacha-app.onrender.com
    steps:
      - name: Verify Branch Governance
        run: |
          echo "=== 1. Branch Protection Enforcement ==="
          # Verify that promotion only occurs from main or approved release tag
          if [[ "${{ github.ref }}" != "refs/heads/main" && ! "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
            echo "FATAL: Production promotion is strictly forbidden from unmerged feature branches."
            exit 1
          fi
          echo "Branch governance passed."

      - name: Checkout Approved Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_commit_sha }}

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: "Gate A: Reproducible Artifact Verification (Staging Match)"
        id: verify-digest
        run: |
          echo "=== Gate A: Reproducible Artifact Verification ==="
          echo "Note: This step verifies local build reproducibility against the approved staging digest;"
          echo "it does not verify deployment identity on the remote hosting provider."
          npm run build
          CURRENT_DIGEST=$(sha256sum dist/server.cjs | awk '{print $1}')
          EXPECTED_DIGEST="${{ inputs.approved_artifact_digest }}"
          
          echo "Expected Staging Digest: ${EXPECTED_DIGEST}"
          echo "Reproduced Digest:       ${CURRENT_DIGEST}"
          
          if [ "${CURRENT_DIGEST}" != "${EXPECTED_DIGEST}" ]; then
            echo "FATAL: Artifact digest mismatch! The current build does not match the approved staging artifact."
            exit 1
          fi
          echo "Artifact digest verified identical to approved staging release (reproducibility confirmed)."

      - name: Verify Migration Checksums Integrity
        run: |
          echo "=== Migration Checksum Gate ==="
          sha256sum server/db/migrations/*.sql
          # Verify no uncommitted or modified migration files exist
          git diff --exit-code server/db/migrations/

      - name: "Gate B: Deployment Execution"
        run: |
          echo "=== Gate B: Deployment Execution ==="
          if [ -z "${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}" ]; then
            echo "FATAL: Configured production deployment mechanism (RENDER_PROD_DEPLOY_HOOK_URL) is missing."
            echo "Automated promotion cannot proceed without an approved, verified deployment mechanism."
            exit 1
          fi

          APPROVED_COMMIT="${{ inputs.approved_commit_sha }}"
          DEPLOY_HOOK="${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}"

          if [[ ! "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: approved_commit_sha must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi

          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            DEPLOY_URL="${DEPLOY_HOOK}&ref=${APPROVED_COMMIT}"
          else
            DEPLOY_URL="${DEPLOY_HOOK}?ref=${APPROVED_COMMIT}"
          fi

          echo "Triggering Render production deployment for approved commit SHA: ${APPROVED_COMMIT}"
          curl -f -s -S -X POST "$DEPLOY_URL" > /dev/null
          echo "Production deployment webhook invoked successfully."

      - name: "Gate C: Deployed Revision Verification"
        run: |
          echo "=== Gate C: Deployed Revision Verification ==="
          PROD_URL="https://abacha-app.onrender.com"
          EXPECTED_REVISION="${{ inputs.approved_commit_sha }}"
          echo "Target Production Host: ${PROD_URL}"
          echo "Expected Revision SHA:  ${EXPECTED_REVISION}"
          
          MAX_RETRIES=18
          RETRY_COUNT=0
          REVISION_MATCH=0
          DEPLOYED_REVISION=""
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            echo "Checking deployed revision at ${PROD_URL}/api/version (attempt $((RETRY_COUNT+1))/${MAX_RETRIES})..."
            VERSION_JSON=$(curl -s "${PROD_URL}/api/version" || true)
            DEPLOYED_REVISION=$(echo "$VERSION_JSON" | grep -o '"revision":"[^"]*"' | cut -d'"' -f4 || true)
            
            if [ -n "$DEPLOYED_REVISION" ] && [ "$DEPLOYED_REVISION" = "$EXPECTED_REVISION" ]; then
              echo "SUCCESS: Deployed runtime revision matches approved commit SHA: ${DEPLOYED_REVISION}"
              REVISION_MATCH=1
              break
            fi
            
            echo "Current deployed revision: '${DEPLOYED_REVISION}' (waiting for rollout of '${EXPECTED_REVISION}')..."
            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 10
          done
          
          if [ "$REVISION_MATCH" -ne 1 ]; then
            echo "FATAL: Deployed revision verification failed! Runtime revision '${DEPLOYED_REVISION}' does not match expected '${EXPECTED_REVISION}'."
            exit 1
          fi

      - name: "Gate D: Production Post-Deployment Health & Readiness Probes"
        run: |
          echo "=== Gate D: Production Health & Readiness Verification ==="
          PROD_URL="https://abacha-app.onrender.com"
          
          MAX_RETRIES=12
          RETRY_COUNT=0
          SUCCESS=0
          
          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            echo "Pinging ${PROD_URL}/api/health and /api/ready (attempt $((RETRY_COUNT+1))/${MAX_RETRIES})..."
            HEALTH_JSON=$(curl -s "${PROD_URL}/api/health" || true)
            READY_JSON=$(curl -s "${PROD_URL}/api/ready" || true)
            
            if echo "$HEALTH_JSON" | grep -q '"status":"ok"' && echo "$READY_JSON" | grep -q '"ready":true'; then
              echo "Production Health and Readiness Probes PASSED!"
              SUCCESS=1
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 10
          done
          
          if [ "$SUCCESS" -ne 1 ]; then
            echo "FATAL: Production health/readiness verification failed."
            exit 1
          fi
          echo "All production deployment gates (A, B, C, D) completed successfully."
