name: Fix API Login Validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'github-actions[bot]' || github.event.head_commit.author.username == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harden login tenant validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old_import = "  validateBody,\n} from './server/validation/index.ts';"
          new_import = "  validateBody,\n  ValidationError,\n} from './server/validation/index.ts';"
          if old_import not in s:
              raise SystemExit('Expected validation import block not found')
          s = s.replace(old_import, new_import, 1)
          old = """    '/api/auth/login',\n    authRateLimiter,\n    validateBody(validateLoginPayload),"""
          new = """    '/api/auth/login',\n    authRateLimiter,\n    validateBody((body) => {\n      const payload = validateLoginPayload(body);\n      if (!payload.organizationId) {\n        throw new ValidationError('Authentication input validation failed', [\n          { field: 'organizationId', message: 'organizationId is required for login' },\n        ]);\n      }\n      return payload;\n    }),"""
          if old not in s:
              raise SystemExit('Expected login validation middleware not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify source change
        run: |
          grep -n -A12 -B2 "'/api/auth/login'" server.ts
          npm ci
          npx tsc --noEmit --pretty false
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-api-login-validation.yml
          git add server.ts
          git commit -m "fix(auth): require tenant on login API boundary"
          git push origin main
