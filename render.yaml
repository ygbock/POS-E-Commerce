services:
  - type: web
    name: abacha-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abacha-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ALLOW_SEEDING_IN_PRODUCTION
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: "86400"

databases:
  - name: abacha-db
    plan: free
    databaseName: abacha
    user: abacha_user
